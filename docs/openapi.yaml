    put:
      tags: [cost]
      summary: บันทึกใบต้นทุน
      description: "ส่งมาทั้งใบ รายการเดิมถูกแทนที่ทั้งหมด — แต่ละบรรทัด fixed = quantity × unit_price, percent = percent% ของรวมบรรทัด fixed แล้ว cost_price = (วัตถุดิบ + ค่าแรง + ค่าใช้จ่ายอื่น) ÷ batch_quantity บันทึกลงสินค้า พร้อม sell_price"
      operationId: saveCostSheet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostSheetRequest"
      responses:
        "200":
          description: บันทึกแล้ว ได้ใบต้นทุนล่าสุด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSheet"
        "400":
          description: ข้อมูลที่ส่งมาผิด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_json:
                  value: { error: invalid_json }
                cost_batch_quantity_invalid:
                  summary: จำนวนที่ผลิตได้ต่อรอบต้องมากกว่า 0
                  value: { error: cost_batch_quantity_invalid }
                product_price_invalid:
                  summary: ราคาขายติดลบ
                  value: { error: product_price_invalid }
                cost_type_invalid:
                  summary: type ต้องเป็น material / labor / overhead
                  value: { error: cost_type_invalid }
                cost_name_required:
                  value: { error: cost_name_required }
                cost_kind_invalid:
                  summary: kind ต้องเป็น fixed / percent
                  value: { error: cost_kind_invalid }
                cost_amount_invalid:
                  summary: จำนวน / ราคาต่อหน่วยติดลบ
                  value: { error: cost_amount_invalid }
                cost_percent_invalid:
                  summary: percent ต้องอยู่ระหว่าง 0 ถึง 1000
                  value: { error: cost_percent_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

