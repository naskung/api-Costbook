        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /stock/in:
    post:
      tags: [stock]
      summary: รับสินค้าเข้า
      description: |
        - ใส่ unit_cost (ราคาทุนต่อหน่วย) มาด้วย → คิดต้นทุนเฉลี่ยของสินค้าใหม่ = (ของเดิม × ทุนเดิม + ของใหม่ × ทุนใหม่) ÷ จำนวนรวม → สินค้าที่ใช้สิ่งนี้เป็นวัสดุคิดต้นทุนใหม่ให้
        - รับเข้า = ผลิตเสร็จ → ตัดวัสดุตามใบต้นทุน (บรรทัดที่มี material_id) จำนวน = จำนวนในบรรทัด ÷ ผลิตได้ต่อรอบ × จำนวนที่รับเข้า (ปัดเป็นจำนวนเต็ม) / `skip_materials: true` = ไม่ตัด
        - วัสดุตัวไหนไม่พอ → 409 `material_not_enough` (ไม่บันทึกอะไรเลย)
      operationId: stockIn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementRequest"
      responses:
        "201":
          $ref: "#/components/responses/MovementCreated"
        "400":
          $ref: "#/components/responses/MovementBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: สินค้านี้ไม่นับสต็อก / วัสดุไม่พอผลิต
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MaterialShortage"
              examples:
                stock_not_tracked:
                  value: { error: stock_not_tracked }
                material_not_enough:
                  value: { error: material_not_enough, material: เส้น TPU, unit: กรัม, need: 300, have: 100 }
        "500":
          $ref: "#/components/responses/ServerError"

  /stock/out:
    post:
      tags: [stock]
      summary: เบิกสินค้าออก
      operationId: stockOut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementRequest"
      responses:
        "201":
          $ref: "#/components/responses/MovementCreated"
        "400":
          $ref: "#/components/responses/MovementBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: ของในสต็อกไม่พอ / สินค้าไม่นับสต็อก
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                stock_not_enough:
                  value: { error: stock_not_enough }
                stock_not_tracked:
                  value: { error: stock_not_tracked }
        "500":
          $ref: "#/components/responses/ServerError"

  /transactions:
    get:
      tags: [transaction]
      summary: รายรับ-รายจ่ายของเดือน (ล่าสุดอยู่บน)
      operationId: listTransactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: รายการของเดือน
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/MonthOrPageInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [transaction]
      summary: เพิ่มรายรับ / รายจ่าย
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: เพิ่มแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /transactions/summary:
    get:
      tags: [transaction]
      summary: สรุปรายรับ รายจ่าย กำไร ของเดือน
      operationId: transactionSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: ยอดสรุป
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        "400":
          $ref: "#/components/responses/MonthInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [transaction]
      summary: แก้รายการ
      description: รายรับที่มาจากใบกำกับแก้ไม่ได้ ต้องยกเลิกใบกำกับ
      operationId: updateTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: บันทึกแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/TransactionBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "409":
          $ref: "#/components/responses/TransactionFromInvoice"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [transaction]
      summary: ลบรายการ
      description: รายรับที่มาจากใบกำกับลบไม่ได้ ต้องยกเลิกใบกำกับ
      operationId: deleteTransaction
      security:
        - bearerAuth: []
      responses:
        "204":
          description: ลบแล้ว (ไม่มี body)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TransactionNotFound"
        "409":
          $ref: "#/components/responses/TransactionFromInvoice"
        "500":
          $ref: "#/components/responses/ServerError"

  /invoices:
    get:
      tags: [invoice]
      summary: เอกสารขายของเดือน (ล่าสุดอยู่บน)
      operationId: listInvoices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: รายการใบกำกับ (ข้อมูลย่อ)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
        "400":
          $ref: "#/components/responses/MonthOrPageInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [invoice]
      summary: ออกเอกสารขาย (ใบกำกับภาษี / ใบเสร็จรับเงิน)
      description: |
        ชนิดเอกสารเลือกจากรูปแบบร้าน (PUT /company): จด VAT → ใบกำกับภาษี `INV-ปี-เลข`, ไม่จด → ใบเสร็จรับเงิน `RC-ปี-เลข` (ไม่มี VAT)
        ทำใน DB transaction เดียว ขั้นไหนพัง ยกเลิกทั้งหมด:
        1. รันเลขที่ใบ (รันใหม่ทุกปี แยกตามชนิดเอกสาร)
        2. บันทึกใบ + รายการสินค้า (เก็บข้อมูลร้าน / ชื่อสินค้า ณ วันที่ออก)
        3. ตัด stock เฉพาะสินค้าที่นับสต็อก (track_stock)
        4. บันทึกรายรับ หมวด sales

        ราคาต่อหน่วย: ร้านตั้ง prices_include_vat = true → ราคารวม VAT แล้ว (ถอด VAT ออกมาแสดง), false → ราคาก่อน VAT (บวก VAT 7%)
        VAT คิดจากยอดรวมทั้งใบหลังหักส่วนลด (discount)
        ใบกำกับภาษี: ร้านต้องมีเลขผู้เสียภาษี และต้องมีชื่อลูกค้า / ใบเสร็จ: ชื่อลูกค้าว่างได้
      operationId: createInvoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequest"
      responses:
        "201":
          description: ออกใบแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: ข้อมูลที่ส่งมาผิด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_json:
                  value: { error: invalid_json }
                invoice_date_invalid:
                  summary: "วันที่ต้องเป็นรูปแบบ 2026-10-31"
                  value: { error: invoice_date_invalid }
                invoice_customer_required:
                  summary: ใบกำกับภาษีต้องมีชื่อลูกค้า
                  value: { error: invoice_customer_required }
                invoice_discount_invalid:
                  summary: ส่วนลดติดลบ / มากกว่ายอดรวม
                  value: { error: invoice_discount_invalid }
                invoice_customer_tax_id_invalid:
                  summary: เลขผู้เสียภาษีลูกค้าไม่ใช่ตัวเลข 13 หลัก
                  value: { error: invoice_customer_tax_id_invalid }
                invoice_items_required:
                  value: { error: invoice_items_required }
                invoice_item_invalid:
                  summary: สินค้าไม่มี id / จำนวน ≤ 0 / ราคาติดลบ
                  value: { error: invoice_item_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "409":
          description: ของในสต็อกไม่พอ / ร้านจด VAT แต่ยังไม่มีเลขผู้เสียภาษี / สินค้าเป็นวัสดุ / วัสดุไม่พอ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                stock_not_enough:
                  value: { error: stock_not_enough }
                company_tax_id_required:
                  value: { error: company_tax_id_required }
                product_not_for_sale:
                  summary: สินค้านี้เป็นวัสดุ (for_sale = false) ขายไม่ได้
                  value: { error: product_not_for_sale }
                material_not_enough:
                  summary: งานที่ไม่นับสต็อกตัดวัสดุตอนขาย วัสดุไม่พอ (มีชื่อวัสดุ / ต้องใช้ / มีอยู่ ดู MaterialShortage)
                  value: { error: material_not_enough, material: เส้น PLA, unit: กรัม, need: 60, have: 20 }
        "500":
          $ref: "#/components/responses/ServerError"

  /invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [invoice]
      summary: เอกสารขาย 1 ใบ พร้อมรายการสินค้า (Flutter เอาไปสร้าง PDF)
      operationId: getInvoice
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ใบกำกับ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/InvoiceNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /invoices/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [invoice]
      summary: ยกเลิกใบกำกับ
      description: ทำใน transaction เดียว — เปลี่ยนสถานะเป็น cancelled + คืน stock (เฉพาะที่เคยตัด) + ลบรายรับของใบนี้
      operationId: cancelInvoice
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ยกเลิกแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/InvoiceNotFound"
        "409":
          description: ใบนี้ยกเลิกไปแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invoice_already_cancelled }
        "500":
          $ref: "#/components/responses/ServerError"

  /dashboard:
    get:
      tags: [dashboard]
      summary: ตัวเลขสรุปหน้าแรกของเดือน
      operationId: getDashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: ตัวเลขสรุป
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "400":
          $ref: "#/components/responses/MonthInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /ai/status:
    get:
      tags: [ai]
      summary: เปิดใช้ AI ได้ไหม
      description: "enabled = false เมื่อยังไม่ได้ใส่ ANTHROPIC_API_KEY (ปุ่ม AI ในหน้าเว็บจะถูกปิด)"
      operationId: getAIStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: สถานะ AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ai/key:
    put:
      tags: [ai]
      summary: ใส่ key ของ Claude (ของร้าน)
      description: "ลองใช้ key กับ Claude ก่อน (ไม่เสียค่า AI) ใช้ได้จริงถึงเก็บแบบเข้ารหัส — API ไม่ส่ง key กลับมาอีก (ได้แค่ 4 ตัวท้ายใน key_hint)"
      operationId: saveAIKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, example: "sk-ant-api03-..." }
      responses:
        "200":
          description: บันทึกแล้ว ได้สถานะ AI ใหม่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIStatus"
        "400":
          description: "JSON พัง / รูปแบบ key ผิด (ai_key_format_invalid) / Claude บอกว่า key ใช้ไม่ได้ (ai_key_invalid)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: ai_key_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AIUnavailable"
    delete:
      tags: [ai]
      summary: ลบ key ของร้าน (กลับไปใช้ AI ฟรี)
      operationId: deleteAIKey
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ลบแล้ว ได้สถานะ AI ใหม่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ai/chat:
    post:
      tags: [ai]
      summary: แชทกับผู้ช่วย AI
      description: |
        ส่งประวัติแชททั้งหมด (API ไม่ได้เก็บแชทไว้) — เริ่มด้วย user สลับกับ assistant จบด้วย user ไม่เกิน 40 ข้อความ ข้อความละไม่เกิน 4,000 ตัวอักษร

        AI อ่านข้อมูลร้านได้เอง (สินค้า ต้นทุน สต็อก ภาพรวม รายรับ-รายจ่าย ผลเช็คราคาตลาด)
        แต่ **แก้ข้อมูลเองไม่ได้** — ได้แค่ `actions` (งานที่เสนอ) ให้ Flutter โชว์ปุ่มยืนยัน แล้วเรียก API เส้นเดิมเมื่อผู้ใช้กด
      operationId: chatWithAI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: คำตอบ + งานที่ AI เสนอ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"
        "400":
          description: "JSON พัง / ประวัติแชทผิดรูปแบบ (ai_messages_invalid) / ข้อความยาวเกิน (ai_message_too_long)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: ai_messages_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/AIRefused"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/AIBadGateway"
        "503":
          $ref: "#/components/responses/AIUnavailable"
        "504":
          $ref: "#/components/responses/AITimeout"

  /products/{id}/market:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [ai]
      summary: ผลเช็คราคาตลาดครั้งล่าสุดของสินค้า
      description: อ่านผลเดิมที่เก็บไว้ ไม่เสียค่า AI (ไม่มี API key ก็ดูได้)
      operationId: getMarketCheck
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ผลเช็คครั้งล่าสุด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "ยังไม่เคยเช็ค (market_check_not_found) / id ไม่ใช่ UUID (product_not_found)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: market_check_not_found }
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [ai]
      summary: ให้ AI ค้นราคาตลาดใหม่
      description: |
        AI ค้นเว็บ (สูงสุด 8 ครั้ง) หาราคาขายปลีก / ขายส่ง / ต้นทุนในตลาดไทย เทียบกับต้นทุน + ราคาของร้าน แล้วบันทึกผล
        **มีค่าใช้จ่าย AI ทุกครั้ง** ใช้เวลาประมาณ 1–3 นาที (รอสูงสุด 5 นาที)
      operationId: checkMarket
      security:
        - bearerAuth: []
      responses:
        "409":
          description: "AI ที่ใช้อยู่ค้นเว็บไม่ได้ (Gemini ที่ไม่มี TAVILY_API_KEY และไม่ได้เปิด GEMINI_WEB_SEARCH) ต้องใส่ key ของ Claude ก่อน (ai_search_unavailable)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: ai_search_unavailable }
        "201":
          description: ผลเช็คใหม่ (บันทึกแล้ว)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "422":
          $ref: "#/components/responses/AIRefused"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/AIBadGateway"
        "503":
          $ref: "#/components/responses/AIUnavailable"
        "504":
          $ref: "#/components/responses/AITimeout"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "token ที่ได้จาก `POST /auth/login` (ส่งใน header `Authorization: Bearer <token>`)"

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: id แบบ UUID (ไม่ใช่ UUID → 404)
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: "เอากี่รายการ (โหลดทีละหน้า เช่น 20) — ไม่ส่ง = ทั้งหมด / มากสุด 200"
      schema:
        type: integer
        minimum: 0
        maximum: 200
        example: 20
    Offset:
      name: offset
      in: query
      description: "ข้ามไปกี่รายการ (หน้า 2 ทีละ 20 = 20) — ไม่ส่ง = 0 / ได้น้อยกว่า limit = หมดแล้ว"
      schema:
        type: integer
        minimum: 0
        example: 0
    Month:
      name: month
      in: query
      description: "เดือนที่ต้องการ รูปแบบ 2026-10 — ไม่ส่ง = เดือนนี้"
      schema:
        type: string
        example: "2026-10"

  responses:
    CategoryBadRequest:
      description: ข้อมูลหมวดไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            category_name_required:
              value: { error: category_name_required }
            category_name_too_long:
              value: { error: category_name_too_long }
            invalid_json:
              value: { error: invalid_json }
    CategoryNotFound:
      description: ไม่พบหมวด หรือ id ไม่ใช่ UUID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: category_not_found }
    CategoryNameTaken:
      description: มีหมวดชื่อนี้แล้ว
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: category_name_taken }
    Forbidden:
      description: role ของผู้ใช้ทำสิ่งนี้ไม่ได้ (เช่น จัดการผู้ใช้ได้เฉพาะเจ้าของร้าน)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: forbidden }
    UserNotFound:
      description: ไม่มีผู้ใช้นี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: user_not_found }
    UserBadRequest:
      description: "ข้อมูลผิด: user_email_invalid / user_name_required / user_name_too_long / user_role_invalid / password_too_short / invalid_json"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: user_name_required }
    Unauthorized:
      description: ไม่มี token / token ผิด / หมดอายุ / ผู้ใช้ถูกลบ / บัญชีถูกปิด → ต้อง login ใหม่
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: unauthorized }
    ServerError:
      description: server มีปัญหา (รายละเอียดจริงอยู่ใน log ของ server)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: server_error }

    PageInvalid:
      description: "limit / offset ไม่ใช่ตัวเลข ติดลบ หรือ limit เกิน 200"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: page_invalid }
    MonthOrPageInvalid:
      description: "month ผิดรูปแบบ (ต้องเป็น 2026-10) หรือ limit / offset ผิด"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            month_invalid:
              value: { error: month_invalid }
            page_invalid:
              value: { error: page_invalid }
    ProductListBadRequest:
      description: ตัวกรองของรายการสินค้าผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            product_kind_invalid:
              value: { error: product_kind_invalid }
            product_category_invalid:
              value: { error: product_category_invalid }
            page_invalid:
              value: { error: page_invalid }
    MonthInvalid:
      description: "month ผิดรูปแบบ (ต้องเป็น 2026-10)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: month_invalid }
    ProductNotFound:
      description: ไม่มีสินค้านี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: product_not_found }
    ProductBadRequest:
      description: ข้อมูลสินค้าผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_json:
              value: { error: invalid_json }
            product_name_required:
              value: { error: product_name_required }
            product_price_invalid:
              summary: ต้นทุน / ราคาขายติดลบ
              value: { error: product_price_invalid }
            product_min_stock_invalid:
              summary: จำนวนขั้นต่ำติดลบ
              value: { error: product_min_stock_invalid }
            product_custom_fields_invalid:
              summary: ช่องเพิ่มเติมเกิน 50 ช่อง หรือค่ายาวเกิน 500 ตัวอักษร
              value: { error: product_custom_fields_invalid }
    MovementCreated:
      description: บันทึกแล้ว ได้ประวัติรายการนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Movement"
    MovementBadRequest:
      description: ข้อมูลที่ส่งมาผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_json:
              value: { error: invalid_json }
            stock_product_required:
              summary: ไม่ได้เลือกสินค้า
              value: { error: stock_product_required }
            stock_quantity_invalid:
              summary: จำนวนต้องมากกว่า 0
              value: { error: stock_quantity_invalid }
            stock_unit_cost_invalid:
              summary: ราคาทุนติดลบ
              value: { error: stock_unit_cost_invalid }
    StockNotEnough:
      description: ของในสต็อกไม่พอ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: stock_not_enough }
    TransactionBadRequest:
      description: ข้อมูลที่ส่งมาผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_json:
              value: { error: invalid_json }
            transaction_type_invalid:
              summary: type ต้องเป็น income / expense
              value: { error: transaction_type_invalid }
            transaction_category_required:
              value: { error: transaction_category_required }
            transaction_amount_invalid:
              summary: จำนวนเงินต้องมากกว่า 0
              value: { error: transaction_amount_invalid }
            transaction_date_invalid:
              summary: "วันที่ต้องเป็นรูปแบบ 2026-10-31"
              value: { error: transaction_date_invalid }
    TransactionNotFound:
      description: ไม่มีรายการนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: transaction_not_found }
    TransactionFromInvoice:
      description: รายการนี้มาจากใบกำกับ แก้ / ลบตรง ๆ ไม่ได้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: transaction_from_invoice }
    InvoiceNotFound:
      description: ไม่มีใบกำกับนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: invoice_not_found }

    ProductCodeTaken:
      description: รหัส / บาร์โค้ดซ้ำกับสินค้าตัวอื่น
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: product_code_taken }
    StockNotTracked:
      description: สินค้านี้ตั้งไว้ว่าไม่นับสต็อก (งานสั่งทำ / ค่าบริการ)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: stock_not_tracked }
    FieldBadRequest:
      description: ข้อมูลช่องผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_json:
              value: { error: invalid_json }
            field_name_required:
              value: { error: field_name_required }
            field_type_invalid:
              summary: type ต้องเป็น text / number / date / select
              value: { error: field_type_invalid }
            field_options_required:
              summary: ช่องแบบ select ต้องมีตัวเลือก และตัวเลือกห้ามว่าง
              value: { error: field_options_required }
    FieldNotFound:
      description: ไม่มีช่องนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: field_not_found }
    CostItemBadRequest:
      description: ข้อมูลรายการต้นทุนผิด
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_json:
              value: { error: invalid_json }
            cost_type_invalid:
              summary: type ต้องเป็น material / labor / overhead
              value: { error: cost_type_invalid }
            cost_material_invalid:
              summary: material_id ไม่มีจริง / เป็นสินค้าตัวเอง / ใช้กับบรรทัด % ไม่ได้
              value: { error: cost_material_invalid }
            cost_kind_invalid:
              summary: kind ต้องเป็น fixed / percent
              value: { error: cost_kind_invalid }
            cost_name_required:
              value: { error: cost_name_required }
            cost_amount_invalid:
              summary: จำนวน / ราคาต่อหน่วยติดลบ
              value: { error: cost_amount_invalid }
            cost_percent_invalid:
              summary: percent ต้องอยู่ระหว่าง 0 ถึง 1000
              value: { error: cost_percent_invalid }
    AIRefused:
      description: AI ปฏิเสธคำขอนี้ (นโยบายความปลอดภัย)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: ai_refused }
    AIBadGateway:
      description: "AI ตอบไม่ครบ (ai_no_result) / เรียก Claude ไม่สำเร็จ (ai_error — รายละเอียดอยู่ใน log)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: ai_no_result }
    AIUnavailable:
      description: "ไม่มี AI ให้ใช้ (ai_not_configured) / API key ผิด (ai_key_invalid) / เครดิตของ key Claude หมด (ai_credit_low) / AI ไม่ว่าง ลองใหม่ทีหลัง (ai_busy) / โควตา AI ฟรีหมด (ai_quota_exceeded) / key ของตัวค้นเว็บ Tavily ผิด (search_key_invalid) / สิทธิ์ค้นเว็บฟรีของเดือนหมด (search_quota_exceeded)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: ai_not_configured }
    AITimeout:
      description: AI ใช้เวลานานเกิน (ai_timeout)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: ai_timeout }
    CostPresetNotFound:
      description: ไม่มีรายการนี้
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: cost_preset_not_found }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: error code ภาษาอังกฤษ
          example: invalid_credentials

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@costbook.com
        password:
          type: string
          format: password
          example: "1234"

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT ไว้แนบมากับ request ที่ต้อง login
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/User"

    ManagedUser:
      type: object
      description: ผู้ใช้แบบเต็ม (หน้าจัดการผู้ใช้ / หลังแก้โปรไฟล์) — ไม่มีรหัสผ่านออกไปเด็ดขาด
      required: [id, email, first_name, last_name, role, active, avatar_version, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, example: staff@costbook.com }
        first_name: { type: string, example: สมชาย }
        last_name: { type: string, example: ใจดี }
        role: { type: string, enum: [owner, manager, staff] }
        active: { type: boolean, description: "false = ถูกปิดบัญชี login ไม่ได้" }
        avatar_version: { type: integer, format: int64, description: "0 = ไม่มีรูป / รูปอยู่ที่ /users/{id}/avatar?v=<avatar_version>" }
        created_at: { type: string, format: date-time }

    ProfileRequest:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string, example: สมชาย, description: ห้ามว่าง ไม่เกิน 100 ตัวอักษร }
        last_name: { type: string, example: ใจดี }

    PasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, description: อย่างน้อย 6 ตัวอักษร }

    UserCreateRequest:
      type: object
      required: [email, first_name, role, password]
      properties:
        email: { type: string, format: email, example: staff@costbook.com, description: "เก็บเป็นตัวเล็ก ห้ามซ้ำ" }
        first_name: { type: string, example: สมชาย }
        last_name: { type: string, example: ใจดี }
        role: { type: string, enum: [owner, manager, staff] }
        password: { type: string, description: "รหัสผ่านแรก อย่างน้อย 6 ตัว (ผู้ใช้เปลี่ยนเองได้ที่หน้าโปรไฟล์)" }

    UserUpdateRequest:
      type: object
      required: [first_name, role]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        role: { type: string, enum: [owner, manager, staff] }
        active: { type: boolean, description: "ไม่ส่ง = ใช้ค่าเดิม" }

    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password: { type: string, description: อย่างน้อย 6 ตัวอักษร }

    User:
      type: object
      required: [id, email, first_name, last_name, role, avatar_version]
      properties:
        id:
          type: string
          format: uuid
          example: a00d265d-5466-4cba-aba7-005953ae30fc
        email:
          type: string
          format: email
          example: admin@costbook.com
        first_name:
          type: string
          example: Admin
        last_name:
          type: string
          example: CostBook
        role:
          type: string
          enum: [owner, manager, staff]
          description: owner = เจ้าของ (ทำได้ทุกอย่าง + จัดการผู้ใช้), manager = ผู้จัดการ, staff = พนักงาน
        avatar_version:
          type: integer
          format: int64
          description: "0 = ไม่มีรูปโปรไฟล์ / รูปอยู่ที่ /users/{id}/avatar?v=<avatar_version>"

    Company:
      type: object
      required: [name, address, tax_id, branch, phone, has_logo, vat_registered, prices_include_vat, use_cost_page]
      properties:
        name:
          type: string
          example: ร้านตัวอย่าง
        address:
          type: string
          example: 123 ถนนสุขุมวิท กรุงเทพฯ 10110
        tax_id:
          type: string
          description: เลขผู้เสียภาษี 13 หลัก (ว่างได้)
          example: "0105555555555"
        branch:
          type: string
          example: สำนักงานใหญ่
        phone:
          type: string
          example: 02-123-4567
        has_logo:
          type: boolean
          description: true = มีโลโก้ โหลดได้จาก GET /company/logo
          example: true
        vat_registered:
          type: boolean
          description: true = ร้านจด VAT ออกใบกำกับภาษี / false = ออกใบเสร็จรับเงิน ไม่มี VAT
          example: true
        prices_include_vat:
          type: boolean
          description: true = ราคาขายของสินค้ารวม VAT แล้ว (ราคาป้ายหน้าร้าน)
          example: false
        use_cost_page:
          type: boolean
          description: true = ใช้หน้าคำนวณต้นทุน (ร้านผลิตเอง) / false = ซ่อนเมนู (ร้านซื้อมาขายไป)
          example: true

    CompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: ชื่อร้าน (ห้ามว่าง)
          example: ร้านตัวอย่าง
        address:
          type: string
          example: 123 ถนนสุขุมวิท กรุงเทพฯ 10110
        tax_id:
          type: string
          description: เลขผู้เสียภาษี ตัวเลข 13 หลัก ไม่มีขีด (ว่างได้)
          example: "0105555555555"
        branch:
          type: string
          example: สำนักงานใหญ่
        phone:
          type: string
          example: 02-123-4567

        vat_registered:
          type: boolean
          description: true = ร้านจด VAT ออกใบกำกับภาษี / false = ออกใบเสร็จรับเงิน ไม่มี VAT (ไม่ส่งมา = ใช้ค่าเดิม)
          example: true
        prices_include_vat:
          type: boolean
          description: true = ราคาขายของสินค้ารวม VAT แล้ว (ไม่ส่งมา = ใช้ค่าเดิม)
          example: false
        use_cost_page:
          type: boolean
          description: true = ใช้หน้าคำนวณต้นทุน / false = ซ่อนเมนู (ไม่ส่งมา = ใช้ค่าเดิม)
          example: true

    ProductCounts:
      type: object
      required: [all, for_sale, material, low]
      properties:
        all:
          type: integer
          example: 8
        for_sale:
          type: integer
          example: 2
        material:
          type: integer
          example: 6
        low:
          type: integer
          description: นับสต็อก และคงเหลือ ≤ ขั้นต่ำ
          example: 8

    Product:
      type: object
      required: [id, code, name, category_id, category, description, unit, cost_price, sell_price, stock, min_stock, batch_quantity, track_stock, custom_fields]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: กาแฟเย็น
        unit:
          type: string
          example: แก้ว
        cost_price:
          type: number
          description: ต้นทุนต่อชิ้น (คำนวณจากหน้าคำนวณต้นทุน หรือกรอกเอง)
          example: 18.5
        sell_price:
          type: number
          description: ราคาขายต่อชิ้น ก่อน VAT
          example: 45
        stock:
          type: integer
          description: จำนวนคงเหลือ (แก้ผ่าน /stock เท่านั้น)
          example: 20
        min_stock:
          type: integer
          description: เหลือเท่านี้หรือน้อยกว่า = ใกล้หมด
          example: 5
        batch_quantity:
          type: integer
          description: จำนวนที่ผลิตได้ต่อรอบ (ใช้คำนวณต้นทุนต่อชิ้น)
          example: 1
        code:
          type: string
          description: รหัส / บาร์โค้ด (ห้ามซ้ำ ว่างได้)
          example: "8851234567890"
        category_id:
          type: string
          description: id ของหมวด (ว่าง = ไม่มีหมวด) — จัดการหมวดที่ /product-categories
          example: "c1111111-1111-1111-1111-111111111111"
        category:
          type: string
          readOnly: true
          description: ชื่อหมวด (อ่านอย่างเดียว ไว้แสดง — เปลี่ยนหมวดด้วย category_id)
          example: เครื่องดื่ม
        description:
          type: string
          example: PLA ขาว ขนาด 7 × 15 ซม.
        track_stock:
          type: boolean
          description: false = ไม่นับสต็อก (งานสั่งทำ / ค่าบริการ) ขายได้ไม่จำกัด / ไม่ส่งมาตอนเพิ่ม-แก้ = true
          example: true
        for_sale:
          type: boolean
