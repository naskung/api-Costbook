  /products/{id}/image:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [product]
      summary: ดูรูปสินค้า (ได้เป็นรูป)
      description: |
        - ต้อง login (ส่ง token ใน header) — Flutter ใช้ `Image.network(url, headers: ...)`
        - ใส่ `?v=<image_version>` ท้าย URL เสมอ → รูปเปลี่ยนแล้ว URL เปลี่ยน browser เก็บรูปไว้ได้นาน (`Cache-Control: max-age`)
      operationId: getProductImage
      security:
        - bearerAuth: []
      parameters:
        - name: v
          in: query
          required: false
          description: image_version ของสินค้า (ไว้บอก browser ว่ารูปเปลี่ยนแล้ว)
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ไฟล์รูปสินค้า
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ไม่มีสินค้า หรือสินค้ายังไม่มีรูป
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                product_not_found:
                  value: { error: product_not_found }
                product_image_not_found:
                  value: { error: product_image_not_found }
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [product]
      summary: อัปโหลดรูปสินค้า (แทนรูปเดิม)
      description: |
        - ส่งแบบ `multipart/form-data` ช่องชื่อ `image`
        - รับแค่ PNG / JPG / WebP (ดูจากข้างในไฟล์จริง ไม่ใช่นามสกุล) ขนาดไม่เกิน 1 MB — Flutter ย่อรูปเป็น JPG ก่อนส่ง
      operationId: uploadProductImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: ไฟล์รูป PNG / JPG / WebP ไม่เกิน 1 MB
      responses:
        "200":
          description: บันทึกแล้ว ได้สินค้าที่มี image_version ใหม่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: ไฟล์ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                product_image_required:
                  summary: ไม่ได้แนบไฟล์ หรือชื่อช่องไม่ใช่ image
                  value: { error: product_image_required }
                product_image_too_large:
                  summary: ไฟล์ใหญ่เกิน 1 MB
                  value: { error: product_image_too_large }
                product_image_type_invalid:
                  summary: ไม่ใช่ PNG / JPG / WebP
                  value: { error: product_image_type_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [product]
      summary: ลบรูปสินค้า
      operationId: deleteProductImage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ลบแล้ว ได้สินค้าที่ image_version = 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /products/{id}/costs:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [cost]
      summary: ใบต้นทุนของสินค้า
      operationId: getCostSheet
