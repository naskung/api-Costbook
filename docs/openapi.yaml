          type: string
          description: ใบกำกับภาษีต้องมี / ใบเสร็จว่างได้
          example: บริษัท ลูกค้า จำกัด
        customer_address:
          type: string
          example: 99 ถนนพหลโยธิน กรุงเทพฯ 10400
        customer_tax_id:
          type: string
          description: ตัวเลข 13 หลัก (ว่างได้)
          example: "0105555555555"
        customer_branch:
          type: string
          example: สำนักงานใหญ่
        note:
          type: string
        discount:
          type: number
          minimum: 0
          description: ส่วนลดทั้งบิล (บาท) ห้ามเกินรวมราคาสินค้า
          example: 10
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceItemRequest"

    InvoiceItemRequest:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit_price:
          type: number
          minimum: 0
          description: ราคาต่อหน่วย (ก่อน VAT หรือรวม VAT ตาม prices_include_vat ของร้าน)
          example: 50

    Dashboard:
      type: object
      required: [month, income, expense, profit, invoice_count, invoice_total, product_count, low_stock_count, low_stock]
      properties:
        month:
          type: string
          example: "2026-10"
        income:
          type: number
          description: เงินเข้าตามที่บันทึก (ไม่ใช่กำไร)
          example: 12500
        expense:
          type: number
          description: เงินออกตามที่บันทึก (รวมซื้อวัตถุดิบ)
          example: 4300.5
        profit:
          type: number
          description: กำไรสุทธิ = revenue − sales.cost − operating_expense (คิดแบบเดียวกับ TransactionSummary)
          example: 2950.5
        revenue: { type: number, description: รายได้ = ยอดขายก่อน VAT + รายรับที่บันทึกเอง, example: 11800 }
        other_income: { type: number, description: รายรับที่บันทึกเอง ไม่ได้มาจากเอกสารขาย, example: 300 }
        material_expense: { type: number, description: รายจ่ายหมวดซื้อวัตถุดิบ (ไม่หักในกำไร), example: 1250 }
        operating_expense: { type: number, description: รายจ่ายที่หักในกำไร = expense − material_expense, example: 3050.5 }
        invoice_count:
          type: integer
          description: จำนวนใบกำกับที่ยังไม่ยกเลิกของเดือน
          example: 8
        invoice_total:
          type: number
          example: 10700
        product_count:
          type: integer
          example: 24
        low_stock_count:
          type: integer
          description: จำนวนสินค้าใกล้หมดทั้งหมด
          example: 3
        low_stock:
          type: array
          description: สินค้าใกล้หมด ไม่เกิน 5 ตัว (เหลือน้อยสุดก่อน)
          items:
            $ref: "#/components/schemas/LowStockItem"
        sales:
          $ref: "#/components/schemas/SalesSummary"
        previous:
          $ref: "#/components/schemas/MonthTotals"
        monthly_trend:
          type: array
          description: ย้อนหลัง 6 เดือน เรียงเก่า → ใหม่ (ตัวสุดท้าย = เดือนที่เลือก)
          items:
            $ref: "#/components/schemas/MonthTotals"
        daily_sales:
          type: array
          description: ยอดขายทุกวันของเดือน (วันที่ไม่ขาย = 0)
          items:
            $ref: "#/components/schemas/DailySales"
        previous_daily_sales:
          type: array
          description: ยอดขายทุกวันของเดือนก่อน (ไว้วาดเส้นเทียบ)
          items:
            $ref: "#/components/schemas/DailySales"
        top_products:
          type: array
          description: สินค้าขายดี 5 อันดับ (ตามยอดขายก่อน VAT หลังหักส่วนลด)
          items:
            $ref: "#/components/schemas/ProductSales"
        category_sales:
          type: array
          description: ยอดขายตามหมวดสินค้า มากไปน้อย (category ว่าง = ไม่มีหมวด)
          items:
            $ref: "#/components/schemas/CategoryAmount"
        expense_by_category:
          type: array
          description: รายจ่ายตามหมวด มากไปน้อย
          items:
            $ref: "#/components/schemas/CategoryAmount"
        stock:
          $ref: "#/components/schemas/StockValue"
        market:
          type: array
          description: ราคาของร้านเทียบกับผลเช็คราคาตลาดครั้งล่าสุด (เฉพาะสินค้าที่เคยเช็ค)
          items:
            $ref: "#/components/schemas/MarketPosition"

    SalesSummary:
      type: object
      description: "ยอดขายจากเอกสารขายของเดือน — net_sales = ก่อน VAT หลังหักส่วนลด (เงินที่ร้านได้จริง), cost = ต้นทุน ณ วันที่ขาย"
      properties:
        net_sales: { type: number, example: 1355.14 }
        cost: { type: number, example: 211.2 }
        gross_profit: { type: number, example: 1143.94 }
        gross_margin: { type: number, description: "กำไรขั้นต้น ÷ ยอดขาย × 100", example: 84.41 }
        vat: { type: number, example: 94.86 }
        discount: { type: number, example: 50 }
        items_sold: { type: integer, example: 5 }
        average_bill: { type: number, description: ยอดขายเฉลี่ยต่อบิล (ก่อน VAT), example: 1355.14 }

    MonthTotals:
      type: object
      properties:
        month: { type: string, example: "2026-10" }
        income: { type: number, example: 2406.15 }
        expense: { type: number, example: 0 }
        profit: { type: number, description: กำไรสุทธิ (คิดแบบเดียวกับ TransactionSummary), example: 1775.72 }
        net_sales: { type: number, description: ยอดขายก่อน VAT จากเอกสารขาย, example: 2250.79 }
        bills: { type: integer, description: จำนวนเอกสารขายที่ไม่ยกเลิก, example: 9 }
        gross_profit: { type: number, description: "ยอดขายก่อน VAT − ต้นทุน ณ วันที่ขาย", example: 1775.72 }
        revenue: { type: number, description: รายได้ = ยอดขายก่อน VAT + รายรับที่บันทึกเอง, example: 2250.79 }
        cost_of_sales: { type: number, description: ต้นทุนสินค้าที่ขาย, example: 475.07 }
        operating_expense: { type: number, description: รายจ่ายที่หักในกำไร (ไม่รวมซื้อวัตถุดิบ), example: 0 }

    DailySales:
      type: object
      properties:
        date: { type: string, format: date, example: "2026-10-31" }
        net_sales: { type: number, example: 1355.14 }
        bills: { type: integer, example: 1 }

    ProductSales:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        name: { type: string, example: เคสโทรศัพท์พิมพ์ 3D }
        unit: { type: string, example: ชิ้น }
        quantity: { type: integer, example: 4 }
        net_sales: { type: number, example: 903.43 }
        cost: { type: number, example: 211.2 }
        profit: { type: number, example: 692.23 }
        margin: { type: number, description: "กำไร ÷ ยอดขาย × 100", example: 76.62 }

    CategoryAmount:
      type: object
      properties:
        category: { type: string, example: งานพิมพ์ 3D }
        amount: { type: number, example: 903.43 }
        percent: { type: number, description: คิดเป็นกี่ % ของทุกหมวด, example: 64.4 }

    StockValue:
      type: object
      description: มูลค่าของในสต็อก (เฉพาะสินค้าที่นับสต็อก)
      properties:
        cost_value: { type: number, description: "คงเหลือ × ต้นทุน", example: 8422.4 }
        retail_value: { type: number, description: "คงเหลือ × ราคาขาย", example: 15322 }
        out_of_stock: { type: integer, description: จำนวนสินค้าที่หมดแล้ว, example: 0 }

    MarketPosition:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        name: { type: string, example: เคสโทรศัพท์พิมพ์ 3D }
        customer_price: { type: number, description: "ราคาที่ลูกค้าจ่าย (ร้านจด VAT ที่ราคาไม่รวม VAT → บวก VAT ก่อน)", example: 250 }
        retail_low: { type: number, example: 199 }
        retail_high: { type: number, example: 390 }
        retail_typical: { type: number, example: 259 }
        position: { type: string, enum: [below, within, above, unknown], description: "ถูกกว่าตลาด / อยู่ในช่วง / แพงกว่า / ไม่มีราคาตลาด" }
        diff_percent: { type: number, description: "ต่างจากราคาที่เจอบ่อยกี่ % (บวก = แพงกว่า)", example: -3.47 }
        checked_at: { type: string, format: date-time }

    AIStatus:
      type: object
      description: AI ที่ใช้อยู่ตอนนี้ (ลำดับ key ของร้าน → key Claude ใน .env → Gemini ฟรี) — ไม่มี key ตัวจริงในคำตอบ
      properties:
        enabled: { type: boolean, example: true }
        provider: { type: string, enum: [claude, gemini, none] }
        model: { type: string, example: claude-opus-5-5 }
        source: { type: string, enum: [settings, env, ""], description: "settings = ร้านใส่เอง, env = ไฟล์ .env" }
        web_search: { type: boolean, description: "ค้นเว็บได้ไหม (เช็คราคาตลาดได้เฉพาะ true) — Claude ได้เสมอ / Gemini ได้เมื่อ API มี TAVILY_API_KEY (ค้นเว็บฟรี) หรือเปิด GEMINI_WEB_SEARCH=on (Gemini แบบเสียเงิน)" }
        has_own_key: { type: boolean, description: ร้านใส่ key Claude เองไว้ไหม }
        key_hint: { type: string, example: "…a1B2", description: 4 ตัวท้ายของ key ที่ร้านใส่ }
        free_available: { type: boolean, description: มี AI ฟรี (Gemini) ให้ใช้ไหม }

    MarketCheck:
      type: object
      description: "ผลเช็คราคาตลาด — ราคาเป็นบาทต่อหน่วยของร้าน 0 = ไม่รู้ / our_* = ต้นทุน + ราคาของร้าน ณ วันที่เช็ค"
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        our_cost_price: { type: number, example: 52.8 }
        our_sell_price: { type: number, example: 250 }
        summary: { type: string, example: ราคาส่วนใหญ่ 199–390 บาท }
        retail_low: { type: number, example: 199 }
        retail_high: { type: number, example: 390 }
        retail_typical: { type: number, example: 259 }
        wholesale_low: { type: number, example: 120 }
        wholesale_high: { type: number, example: 150 }
        wholesale_note: { type: string, example: ขั้นต่ำ 50 ชิ้น }
        market_cost: { type: number, description: ต้นทุนต่อหน่วยที่ร้านอื่นน่าจะใช้, example: 45 }
        cost_items:
          type: array
          items:
            $ref: "#/components/schemas/MarketCostItem"
        suggested_price: { type: number, description: ราคาที่แนะนำ (ราคาที่ลูกค้าจ่าย), example: 259 }
        advice: { type: string, example: ตั้ง 259 บาท ใกล้ราคาที่เจอบ่อย }
        confidence: { type: string, enum: [low, medium, high] }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/MarketSource"
        search_suggestions:
          type: string
          description: "แถบคำค้นแนะนำของ Google (HTML) — มีเมื่อเช็คด้วย Gemini (ค้นผ่าน Google) / กติกาของ Google: ต้องแสดงคู่กับผลเสมอ ห้ามแก้ไข / เช็คด้วย Claude = ว่าง"
        checked_at: { type: string, format: date-time }

    MarketCostItem:
      type: object
      properties:
        name: { type: string, example: เส้น PLA }
        amount: { type: number, example: 18 }
        note: { type: string, example: "40 กรัม × 0.45" }

    MarketSource:
      type: object
      properties:
        title: { type: string, example: Shopee }
        url: { type: string, example: "https://shopee.co.th/..." }
        price: { type: number, example: 259 }
        kind: { type: string, enum: [retail, wholesale, material] }

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, example: สินค้าตัวไหนกำไรดีที่สุด }

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    ChatReply:
      type: object
      properties:
        reply: { type: string, example: "กดยืนยันด้านล่างได้เลยครับ" }
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AIAction"

    AIAction:
      type: object
      description: |
        งานที่ AI เสนอ (API ยังไม่ได้ทำ) — ผู้ใช้กดยืนยันแล้ว Flutter เรียก:
        - create_product → POST /products (data)
        - update_product → PUT /products/{product_id} (data = สินค้าทั้งตัวหลังแก้, changes = ช่องที่เปลี่ยน)
        - stock_in / stock_out → POST /stock/in หรือ /stock/out (data)
        - add_transaction → POST /transactions (data)
        - market_check → POST /products/{product_id}/market
      properties:
        id: { type: string, description: id ของงาน (ไม่ซ้ำในคำตอบเดียว) }
        type: { type: string, enum: [create_product, update_product, stock_in, stock_out, add_transaction, market_check] }
        reason: { type: string, example: ผู้ใช้สั่งรับเข้า }
        product_id: { type: string }
        product_name: { type: string, example: เคสโทรศัพท์ }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: sell_price }
              from: { example: 250 }
              to: { example: 290 }
        data:
          type: object
          description: ข้อมูลที่ส่งให้ API เส้นจริง (ตาม type)

    LowStockItem:
      type: object
      required: [product_id, name, unit, stock, min_stock]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          example: กาแฟเย็น
        unit:
          type: string
          example: แก้ว
        stock:
          type: integer
          example: 2
        min_stock:
          type: integer
          example: 5
