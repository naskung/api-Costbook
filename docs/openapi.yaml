# เอกสาร API แบบ OpenAPI (Swagger) — เปิดดูที่ http://localhost:8080/docs ตอนรัน make run
# เพิ่ม / แก้ endpoint เมื่อไหร่ ต้องแก้ไฟล์นี้ด้วยทุกครั้ง
openapi: 3.0.3
info:
  title: CostBook API
  version: 0.13.0
  description: |
    API ของ CostBook — คำนวณต้นทุนสินค้า, ใบกำกับภาษี, รายรับ-รายจ่าย, stock

    **วิธีลองเรียก API ที่ต้อง login**
    1. เปิด `POST /auth/login` → กด **Try it out** → **Execute**
    2. copy ค่า `token` จากผลลัพธ์ (ไม่ต้องมีเครื่องหมาย `"`)
    3. กดปุ่ม **Authorize** มุมขวาบน → วาง token → **Authorize** → **Close**
    4. เรียก `GET /auth/me` ได้เลย

    error ทุกตัวตอบเป็น `{"error": "code"}` — Flutter แปลเป็นข้อความด้วย `'error.<code>'.tr`
servers:
  - url: /api/v1
tags:
  - name: system
    description: เช็คสถานะ API
  - name: auth
    description: login และข้อมูลผู้ใช้
  - name: user
    description: "โปรไฟล์ของตัวเอง (ชื่อ / รหัสผ่าน / รูป) + จัดการผู้ใช้ (เฉพาะเจ้าของร้าน) — role: owner = เจ้าของ, manager = ผู้จัดการ, staff = พนักงาน"
  - name: company
    description: ข้อมูลร้าน (ผู้ขาย) + โลโก้ ใช้บนหน้าเว็บและใบกำกับภาษี — 1 ระบบ = 1 ร้าน
  - name: product
    description: สินค้า (ต้อง login)
  - name: category
    description: หมวดหมู่สินค้า (เพิ่ม / เปลี่ยนชื่อ / ลบ) — สินค้าชี้หมวดด้วย category_id
  - name: field
    description: ช่องข้อมูลเพิ่มเติมของสินค้าที่ร้านตั้งเอง เช่น วัสดุ สี วันหมดอายุ (ต้อง login)
  - name: cost
    description: คำนวณต้นทุนต่อชิ้น จากรายการวัตถุดิบ / ค่าแรง / ค่าใช้จ่ายอื่น (ต้อง login)
  - name: stock
    description: จำนวนคงเหลือ รับเข้า / เบิกออก (ต้อง login)
  - name: transaction
    description: รายรับ-รายจ่าย และสรุปรายเดือน (ต้อง login)
  - name: invoice
    description: เอกสารขาย (ใบกำกับภาษี / ใบเสร็จรับเงิน ตามรูปแบบร้าน) — ออกใบแล้วตัด stock + บันทึกรายรับให้อัตโนมัติ แก้ / ลบไม่ได้ ผิดให้ยกเลิก (ต้อง login)
  - name: dashboard
    description: ตัวเลขสรุปหน้าแรก (ต้อง login)
  - name: ai
    description: "AI เช็คราคาตลาด + แชทผู้ช่วย — ใช้ Claude เมื่อร้านใส่ key (หน้าตั้งค่า / .env) ไม่มี = Gemini ฟรี (แชทได้ ค้นเว็บไม่ได้) (ต้อง login)"

paths:
  /health:
    get:
      tags: [system]
      summary: เช็คว่า API ทำงานอยู่
      operationId: health
      responses:
        "200":
          description: API ทำงานปกติ
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      tags: [auth]
      summary: login ด้วยอีเมล + รหัสผ่าน
      description: |
        - อีเมลไม่สนตัวพิมพ์เล็ก / ใหญ่ และตัดช่องว่างหน้า-หลังให้
        - อีเมลไม่มีในระบบ หรือรหัสผ่านผิด ได้ `invalid_credentials` เหมือนกัน (คนเดาจะไม่รู้ว่าอีเมลนี้มีจริงไหม)
        - token มีอายุ 7 วัน
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: login สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: ข้อมูลที่ส่งมาผิด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_json:
                  summary: JSON ผิดรูปแบบ
                  value: { error: invalid_json }
                email_required:
                  summary: ไม่ได้กรอกอีเมล
                  value: { error: email_required }
                password_required:
                  summary: ไม่ได้กรอกรหัสผ่าน
                  value: { error: password_required }
        "401":
          description: อีเมลหรือรหัสผ่านไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid_credentials }
        "403":
          description: รหัสถูก แต่เจ้าของร้านปิดบัญชีนี้ไว้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: user_disabled }
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/me:
    get:
      tags: [auth]
      summary: ข้อมูลผู้ใช้ที่ login อยู่
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /profile:
    put:
      tags: [user]
      summary: แก้ชื่อของตัวเอง
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "200":
          description: ข้อมูลผู้ใช้หลังแก้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/UserBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /profile/password:
    put:
      tags: [user]
      summary: เปลี่ยนรหัสผ่านของตัวเอง (ต้องใส่รหัสเดิม)
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "204":
          description: เปลี่ยนแล้ว (token เดิมยังใช้ได้)
        "400":
          description: "ข้อมูลผิด: ไม่ได้ใส่รหัสเดิม (password_current_required) / รหัสเดิมไม่ถูก (password_current_invalid) / รหัสใหม่สั้นเกิน 6 ตัว (password_too_short)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: password_current_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /profile/avatar:
    put:
      tags: [user]
      summary: อัปโหลดรูปโปรไฟล์ของตัวเอง (แทนรูปเดิม)
      description: ส่งแบบ `multipart/form-data` ช่องชื่อ `avatar` — PNG / JPG / WebP ไม่เกิน 1 MB (ดูจากข้างในไฟล์จริง)
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: ไฟล์รูป PNG / JPG / WebP ไม่เกิน 1 MB
      responses:
        "200":
          description: บันทึกแล้ว ได้ผู้ใช้ที่มี avatar_version ใหม่
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: "ไฟล์ไม่ถูกต้อง: avatar_required / avatar_too_large / avatar_type_invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: avatar_too_large }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [user]
      summary: ลบรูปโปรไฟล์ของตัวเอง
      operationId: deleteAvatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ลบแล้ว ได้ผู้ใช้ที่ avatar_version = 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /users:
    get:
      tags: [user]
      summary: ผู้ใช้ทั้งหมด (เฉพาะเจ้าของร้าน)
      description: เรียงเจ้าของ → ผู้จัดการ → พนักงาน / บัญชีที่ใช้งานอยู่ก่อน
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: รายชื่อผู้ใช้
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [user]
      summary: เพิ่มผู้ใช้ + ตั้งรหัสผ่านแรก (เฉพาะเจ้าของร้าน)
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: เพิ่มแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/UserBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: อีเมลนี้มีผู้ใช้แล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: user_email_taken }
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [user]
      summary: แก้ชื่อ / role / เปิด-ปิดบัญชี (เฉพาะเจ้าของร้าน)
      description: บัญชีที่ถูกปิด login ไม่ได้ (403 user_disabled) และ token เดิมใช้ไม่ได้ทันที (401) / ร้านต้องเหลือเจ้าของที่ใช้งานได้อย่างน้อย 1 คน
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: แก้แล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/UserBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: แก้แล้วร้านจะไม่เหลือเจ้าของที่ใช้งานได้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: user_last_owner }
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [user]
      summary: ตั้งรหัสผ่านใหม่ให้ผู้ใช้ (เฉพาะเจ้าของร้าน ไม่ต้องรู้รหัสเดิม)
      operationId: resetUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: ตั้งแล้ว
        "400":
          description: รหัสใหม่สั้นเกิน 6 ตัว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: password_too_short }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/avatar:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [user]
      summary: ดูรูปโปรไฟล์ (ได้เป็นรูป — ทุกคนที่ login ดูได้)
      description: ใส่ `?v=<avatar_version>` ท้าย URL เสมอ → รูปเปลี่ยนแล้ว URL เปลี่ยน browser เก็บรูปไว้ได้นาน
      operationId: getAvatar
      security:
        - bearerAuth: []
      parameters:
        - name: v
          in: query
          required: false
          description: avatar_version ของผู้ใช้
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: ไฟล์รูป
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: ไม่มีผู้ใช้ (user_not_found) หรือยังไม่มีรูป (avatar_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: avatar_not_found }
        "500":
          $ref: "#/components/responses/ServerError"

  /company:
    get:
      tags: [company]
      summary: ดูข้อมูลร้าน
      description: ไม่ต้อง login → หน้า login แสดงชื่อร้านได้
      operationId: getCompany
      responses:
        "200":
          description: ข้อมูลร้าน
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [company]
      summary: แก้ข้อมูลร้าน
      description: ข้อความส่งมาครบทุกช่อง ช่องที่ไม่ส่งจะกลายเป็นค่าว่าง — รูปแบบร้าน (vat_registered, prices_include_vat, use_cost_page) ไม่ส่งมา = ใช้ค่าเดิม
      operationId: updateCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
      responses:
        "200":
          description: บันทึกแล้ว ได้ข้อมูลร้านล่าสุด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: ข้อมูลที่ส่งมาผิด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_json:
                  summary: JSON ผิดรูปแบบ
                  value: { error: invalid_json }
                company_name_required:
                  summary: ไม่ได้กรอกชื่อร้าน
                  value: { error: company_name_required }
                company_tax_id_invalid:
                  summary: เลขผู้เสียภาษีไม่ใช่ตัวเลข 13 หลัก
                  value: { error: company_tax_id_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /company/logo:
    get:
      tags: [company]
      summary: ดูโลโก้ร้าน (ได้เป็นรูป)
      description: ไม่ต้อง login → หน้า login แสดงโลโก้ได้ / ใช้กับ `Image.network` ได้เลย / ได้ 404 ให้แสดงโลโก้ CostBook แทน
      operationId: getCompanyLogo
      responses:
        "200":
          description: ไฟล์รูปโลโก้
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: ยังไม่มีโลโก้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: logo_not_found }
        "500":
          $ref: "#/components/responses/ServerError"
    put:
      tags: [company]
      summary: อัปโหลดโลโก้ (แทนอันเดิม)
      description: |
        - ส่งแบบ `multipart/form-data` ช่องชื่อ `logo`
        - รับแค่ PNG / JPG / WebP (ดูจากข้างในไฟล์จริง ไม่ใช่นามสกุล) ขนาดไม่เกิน 1 MB
      operationId: uploadCompanyLogo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: ไฟล์รูป PNG / JPG / WebP ไม่เกิน 1 MB
      responses:
        "200":
          description: บันทึกแล้ว ได้ข้อมูลร้านล่าสุด (has_logo = true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: ไฟล์ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                logo_required:
                  summary: ไม่ได้แนบไฟล์ หรือชื่อช่องไม่ใช่ logo
                  value: { error: logo_required }
                logo_too_large:
                  summary: ไฟล์ใหญ่เกิน 1 MB
                  value: { error: logo_too_large }
                logo_type_invalid:
                  summary: ไม่ใช่ PNG / JPG / WebP
                  value: { error: logo_type_invalid }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [company]
      summary: ลบโลโก้ (กลับไปใช้โลโก้ CostBook)
      operationId: deleteCompanyLogo
      security:
        - bearerAuth: []
      responses:
        "204":
          description: ลบแล้ว (ไม่มี body)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /products:
    get:
      tags: [product]
      summary: รายการสินค้า (เรียงตามชื่อ) — ไม่ส่งอะไร = ทั้งหมด / หน้ารายการสินค้าโหลดทีละ 20 พร้อมตัวกรอง
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: ค้นจากชื่อ / รหัส / หมวด / รายละเอียด / ค่าในช่องข้อมูลเพิ่มเติม (ไม่สนตัวพิมพ์เล็ก-ใหญ่)
          schema:
            type: string
        - name: category_id
          in: query
          description: เฉพาะหมวดนี้ (ไม่ส่ง = ทุกหมวด)
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          description: sale = เฉพาะสินค้าที่ขาย / material = เฉพาะวัสดุ (ไม่ส่ง = ทั้งหมด)
          schema:
            type: string
