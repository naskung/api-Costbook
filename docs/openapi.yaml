          example: 250.5
        date:
          type: string
          format: date
          example: "2026-10-31"
        note:
          type: string
          example: ซื้อแป้ง

    TransactionSummary:
      type: object
      description: |
        สรุปเงินของเดือน — หน้าภาพรวมคิดแบบเดียวกัน
        - **รายได้** `revenue` = ยอดขายก่อน VAT (`sales`) + รายรับที่บันทึกเอง (`other_income`)
        - **กำไรขั้นต้น** `gross_profit` = `sales` − ต้นทุนสินค้าที่ขาย (`cost_of_sales`, ต้นทุน ณ วันที่ขาย)
        - **กำไรสุทธิ** `profit` = `revenue` − `cost_of_sales` − `operating_expense` (รายจ่ายไม่รวมหมวดซื้อวัตถุดิบ เพราะคิดในต้นทุนสินค้าแล้ว)
        - `income` / `expense` = เงินเข้า / ออกตามที่บันทึก (รายรับจากเอกสารขายรวม VAT) — ไม่ใช่กำไร
      required: [month, income, expense, sales, other_income, revenue, cost_of_sales, gross_profit, material_expense, operating_expense, profit]
      properties:
        month:
          type: string
          example: "2026-11"
        income: { type: number, description: เงินเข้าทั้งหมดตามที่บันทึก, example: 1370 }
        expense: { type: number, description: เงินออกทั้งหมดตามที่บันทึก (รวมซื้อวัตถุดิบ), example: 1600 }
        sales: { type: number, description: ยอดขายก่อน VAT หลังหักส่วนลด (เอกสารขายที่ไม่ยกเลิก), example: 1000 }
        other_income: { type: number, description: รายรับที่บันทึกเอง ไม่ได้มาจากเอกสารขาย, example: 300 }
        revenue: { type: number, description: รายได้ = sales + other_income, example: 1300 }
        cost_of_sales: { type: number, description: ต้นทุนสินค้าที่ขาย (จำนวน × ต้นทุน ณ วันที่ขาย), example: 600 }
        gross_profit: { type: number, description: กำไรขั้นต้น = sales − cost_of_sales, example: 400 }
        material_expense: { type: number, description: รายจ่ายหมวดซื้อวัตถุดิบ (ไม่หักในกำไร), example: 1250 }
        operating_expense: { type: number, description: รายจ่ายที่หักในกำไร = expense − material_expense, example: 350 }
        profit:
          type: number
          description: กำไรสุทธิ = revenue − cost_of_sales − operating_expense (ขาดทุน = ติดลบ)
          example: 350

