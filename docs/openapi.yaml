# เอกสาร API แบบ OpenAPI (Swagger) — เปิดดูที่ http://localhost:8080/docs ตอนรัน make run
# เพิ่ม / แก้ endpoint เมื่อไหร่ ต้องแก้ไฟล์นี้ด้วยทุกครั้ง
openapi: 3.0.3
info:
  title: CostBook API
  version: 0.1.0
  description: |
    API ของ CostBook — คำนวณต้นทุนสินค้า, ใบกำกับภาษี, รายรับ-รายจ่าย, stock

    **วิธีลองเรียก API ที่ต้อง login**
    1. เปิด `POST /auth/login` → กด **Try it out** → **Execute**
    2. copy ค่า `token` จากผลลัพธ์ (ไม่ต้องมีเครื่องหมาย `"`)
    3. กดปุ่ม **Authorize** มุมขวาบน → วาง token → **Authorize** → **Close**
    4. เรียก `GET /auth/me` ได้เลย

    error ทุกตัวตอบเป็น `{"error": "code"}` — Flutter แปลเป็นข้อความด้วย `'error.<code>'.tr`
servers:
  - url: /api/v1
tags:
  - name: system
    description: เช็คสถานะ API
  - name: auth
    description: login และข้อมูลผู้ใช้

paths:
  /health:
    get:
      tags: [system]
      summary: เช็คว่า API ทำงานอยู่
      operationId: health
      responses:
        "200":
          description: API ทำงานปกติ
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      tags: [auth]
      summary: login ด้วยอีเมล + รหัสผ่าน
      description: |
        - อีเมลไม่สนตัวพิมพ์เล็ก / ใหญ่ และตัดช่องว่างหน้า-หลังให้
        - อีเมลไม่มีในระบบ หรือรหัสผ่านผิด ได้ `invalid_credentials` เหมือนกัน (คนเดาจะไม่รู้ว่าอีเมลนี้มีจริงไหม)
        - token มีอายุ 7 วัน
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: login สำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: ข้อมูลที่ส่งมาผิด
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_json:
                  summary: JSON ผิดรูปแบบ
                  value: { error: invalid_json }
                email_required:
                  summary: ไม่ได้กรอกอีเมล
                  value: { error: email_required }
                password_required:
                  summary: ไม่ได้กรอกรหัสผ่าน
                  value: { error: password_required }
        "401":
          description: อีเมลหรือรหัสผ่านไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid_credentials }
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/me:
    get:
      tags: [auth]
      summary: ข้อมูลผู้ใช้ที่ login อยู่
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "token ที่ได้จาก `POST /auth/login` (ส่งใน header `Authorization: Bearer <token>`)"

  responses:
    Unauthorized:
      description: ไม่มี token / token ผิด / หมดอายุ / ผู้ใช้ถูกลบ → ต้อง login ใหม่
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: unauthorized }
    ServerError:
      description: server มีปัญหา (รายละเอียดจริงอยู่ใน log ของ server)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: server_error }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: error code ภาษาอังกฤษ
          example: invalid_credentials

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@costbook.com
        password:
          type: string
          format: password
          example: "1234"

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT ไว้แนบมากับ request ที่ต้อง login
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, first_name, last_name]
      properties:
        id:
          type: string
          format: uuid
          example: a00d265d-5466-4cba-aba7-005953ae30fc
        email:
          type: string
          format: email
          example: admin@costbook.com
        first_name:
          type: string
          example: Admin
        last_name:
          type: string
          example: CostBook
